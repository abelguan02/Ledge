<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>投放面板 · 拖入文字</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#64D2FF}a:hover{color:#C4EEFF}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 720px; height: 520px; overflow: hidden; background: linear-gradient(160deg, #4A5260 0%, #2B3038 100%); font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; color: #F5F5F7;">
<div style="position: absolute; z-index: 2; left: 440px; top: 344px; width: 200px;">
<div style="box-sizing: border-box; width: 200px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.92); color: #1B2028; font-size: 12px; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,0.35);">YAML 和 JSON 都是用来写配置和数据的文本格式……</div>
<svg style="position: absolute; left: 176px; top: 40px;" width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M2 2v19l5-5 3.5 8 3-1.3-3.5-7.7H17z" fill="#FFFFFF" stroke="#111113" stroke-width="1.4" stroke-linejoin="round"></path></svg>
</div>
<div style="position: absolute; right: 0; top: 60px; width: 300px; height: 400px; box-sizing: border-box; padding: 16px; border-radius: 22px 0 0 22px; background: #111113; box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 1px 0 0 rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px;">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #64D2FF;"></span>
<span style="font-size: 13px; font-weight: 600;">一段文字</span>
<span style="flex-grow: 1;"></span>
<span style="font-size: 12px; color: #A1A1A6;">周报材料</span>
</div>
<button type="button" style="flex-grow: 1; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.03); color: #F5F5F7; font-size: 15px; font-weight: 600; cursor: pointer;">放进这件事</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<button type="button" style="height: 64px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.03); color: #F5F5F7; font-size: 13px; font-weight: 600; cursor: pointer;">翻译</button>
<button type="button" style="height: 64px; border-radius: 14px; border: 1.5px solid rgba(245,245,247,0.6); background: rgba(255,255,255,0.07); color: #F5F5F7; font-size: 13px; font-weight: 600; cursor: pointer;">解释</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
